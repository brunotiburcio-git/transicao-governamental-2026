<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Transição Governamental 2026</title>
<link rel="icon" href="imagens/brasao.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<main id="entrada" class="entrada" hidden>
  <form id="form-entrada" class="cartao-entrada">
    <img src="imagens/brasao.png" alt="" width="64" height="64">
    <h1>Transição Governamental 2026</h1>
    <p class="apoio">Ministério das Cidades</p>
    <label>Usuário <input id="login-usuario" autocomplete="username" required></label>
    <label>Senha <input id="login-senha" type="password" autocomplete="current-password" required></label>
    <p class="erro" id="login-erro" role="alert"></p>
    <button type="submit" class="primario" id="login-entrar">Entrar</button>
  </form>
</main>

<div id="sistema" hidden>
  <header class="topo">
    <img src="imagens/brasao.png" alt="" width="44" height="44">
    <div class="topo-texto">
      <h1>Transição Governamental 2026</h1>
      <p class="apoio">Ministério das Cidades</p>
    </div>
    <p class="quem"><span id="usuario-nome"></span> <button type="button" id="sair" class="discreto">Sair</button></p>
  </header>

  <nav class="abas" aria-label="Áreas do sistema">
    <button type="button" id="aba-itens" aria-pressed="true">Itens</button>
    <button type="button" id="aba-material" aria-pressed="false">Material de apoio</button>
  </nav>

  <main class="pagina" id="area-itens">
    <div class="acoes">
      <button type="button" class="primario" id="novo">Novo registro</button>
      <button type="button" id="atualizar">Atualizar lista</button>
      <button type="button" id="exportar-xlsx">Exportar Excel</button>
      <button type="button" id="exportar-csv">Exportar CSV</button>
      <button type="button" id="importar">Importar Excel</button>
      <input type="file" id="arquivo" accept=".xlsx" multiple hidden>
    </div>

    <div class="filtros">
      <label>Unidade <select id="filtro-unidade"></select></label>
      <label>Tipo <select id="filtro-tipo"></select></label>
      <label>Status <select id="filtro-status"></select></label>
      <label class="busca">Buscar <input type="search" id="busca" placeholder="Título ou descrição"></label>
    </div>

    <p id="mensagem" class="mensagem" role="status"></p>

    <div class="tabela-rolagem" id="tabela">
    <table>
      <thead>
        <tr id="cabecalho-itens"><th data-coluna="unidade"><button type="button" class="ordenar">Responsável</button></th><th data-coluna="tipo"><button type="button" class="ordenar">Tipo</button></th><th data-coluna="titulo"><button type="button" class="ordenar">Título</button></th><th data-coluna="status"><button type="button" class="ordenar">Status</button></th><th data-coluna="descricao"><button type="button" class="ordenar">Descrição</button></th><th data-coluna="atualizadoEm"><button type="button" class="ordenar">Atualizado</button></th><th><span class="oculto">Ações</span></th></tr>
      </thead>
      <tbody id="linhas"></tbody>
    </table>
    </div>
    <p id="vazio" class="vazio" hidden></p>
  </main>

  <main class="pagina" id="area-material" hidden>
    <p class="apoio">Documentos para consulta. Clique no nome para abrir ou em Baixar para salvar no computador.</p>
    <div class="tabela-rolagem" id="tabela-material">
      <table>
        <thead><tr><th>Arquivo</th><th>Tamanho</th><th>Data</th><th><span class="oculto">Baixar</span></th></tr></thead>
        <tbody id="linhas-material"></tbody>
      </table>
    </div>
    <p id="vazio-material" class="vazio" hidden>Nenhum documento disponível ainda.</p>
  </main>
</div>

<dialog id="janela">
  <form id="form-registro" novalidate>
    <h2 id="janela-titulo">Novo registro</h2>

    <label>Responsável (unidade)
      <select id="campo-unidade" required></select>
    </label>

    <label>Tipo
      <select id="campo-tipo" required></select>
    </label>
    <p class="ajuda" id="tipo-ajuda"></p>

    <label>Título
      <select id="campo-titulo" required></select>
    </label>
    <label id="bloco-novo-titulo" hidden>Novo título
      <input id="campo-novo-titulo" maxlength="300">
    </label>

    <label>Descrição
      <textarea id="campo-descricao" rows="8" maxlength="2000" required></textarea>
    </label>
    <p class="ajuda contador" id="descricao-contador"></p>

    <label id="bloco-ato" hidden>Ato de criação
      <input id="campo-ato" maxlength="1000">
    </label>

    <p class="erro" id="form-erro" role="alert"></p>
    <div class="botoes">
      <button type="button" id="cancelar">Cancelar</button>
      <button type="submit" id="salvar">Salvar</button>
      <button type="button" class="primario" id="salvar-enviar">Salvar e enviar para validação</button>
    </div>
  </form>
</dialog>

<dialog id="detalhe">
  <div class="detalhe">
    <h2 id="detalhe-titulo"></h2>
    <dl id="detalhe-campos"></dl>
    <label id="bloco-analise" hidden>Observação da validação (obrigatória para devolver)
      <textarea id="detalhe-observacao" rows="3" maxlength="2000"></textarea>
    </label>
    <p class="erro" id="detalhe-erro" role="alert"></p>
    <div class="botoes">
      <button type="button" id="detalhe-excluir" class="perigo">Excluir</button>
      <button type="button" id="detalhe-editar">Editar</button>
      <button type="button" id="detalhe-devolver">Devolver para revisão</button>
      <button type="button" id="detalhe-validar" class="primario">Validar</button>
      <button type="button" id="detalhe-enviar" class="primario">Enviar para validação</button>
      <button type="button" id="detalhe-fechar">Fechar</button>
    </div>
  </div>
</dialog>

<script src="js/config.js"></script>
<script src="js/material.js"></script>
<script src="js/xlsx.mini.min.js"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
